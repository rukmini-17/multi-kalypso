model: Qwen/Qwen2.5-7B-Instruct
hardware:
  gpu_type: A10
n_workers: [2, 3, 4]
policies: [round_robin, least_outstanding, cost_aware, row_affinity]
workloads:
  - {name: fever, rows: 500}
  - {name: medec, rows: 300}
  - {name: contract_nli, rows: 200}
reps: 3
reset_prefix_cache: true
allow_fewer_rows: false
vllm:
  max_model_len: 4096
  gpu_memory_utilization: 0.95
  extra_args: []
instrumentation:
  record_requests: true
  poll_interval: 0.5
  kv_cache_metrics_sample: null
  capture_kv_stats: true
timeouts:
  worker_ready_s: 1800
  coordinator_ready_s: 120
  query_s: 3600
